services:
  resolvedesk-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolvedesk-ai-cloud
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - AUTH_SECRET=${AUTH_SECRET:-resolvedesk-enterprise-local-secret-key-2026}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_resolvedesk_local_test_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - resolvedesk_sql_data:/app/data
    restart: unless-stopped

volumes:
  resolvedesk_sql_data:
